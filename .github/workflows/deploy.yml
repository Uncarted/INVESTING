name: Deploy to GitHub Pages

# Builds the app and publishes it to the gh-pages branch on every push.
# Site: https://uncarted.github.io/INVESTING/

on:
  push:
    branches: [claude/investment-portfolio-tracker-ickzvk, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Public by design: access is enforced by Row Level Security in Supabase.
      VITE_SUPABASE_URL: https://uqdpylmmxwhmchgpbplq.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_7h5lgCn-K5xJJKk8ehkIzQ_9ZsXxsRl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish to gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
